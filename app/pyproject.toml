[project]
name = "mongolab"
version = "0.1.0"
description = "L'applicazione dimostrativa del lab MongoDB di SqlStart 2026"
requires-python = ">=3.13,<3.14"
dependencies = [
    "pymongo>=4.10",
    "typer>=0.15",
    "rich>=13.9",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "mypy>=1.13",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mongolab"]

[tool.pytest.ini_options]
# `tests/unit` e non `tests`: l'integrazione si chiede per nome. Con `tests` un `pytest`
# nudo — quello che si digita distrattamente — accenderebbe Docker dal Task 8 in poi, e
# la suite veloce smetterebbe di esserlo senza che nessuno l'abbia deciso.
testpaths = ["tests/unit"]
# Nessun `pythonpath = ["."]` qui, ed è voluto: `tools/` ne ha bisogno perché gli
# strumenti stanno nella radice del progetto, mentre questo usa il layout `src/` e il
# pacchetto arriva a pytest perché è **installato** nell'ambiente. Chi copia il file di
# `tools/` per farne un altro si porta dietro quella riga senza accorgersene, e allora
# `sys.path` contiene la radice: gli import continuano a funzionare, ma dall'albero dei
# sorgenti invece che dal pacchetto installato — cioè la prova non verifica più ciò che
# si distribuisce. Il layout `src/` esiste apposta per rendere impossibile quello sbaglio,
# e aggiungere la riga lo rimetterebbe in piedi.

[tool.mypy]
strict = true
files = ["src", "tests"]
# Le porte sono `typing.Protocol` e la conformità di un doppio è **strutturale**: non c'è
# un'ereditarietà che il lettore possa controllare a occhio, e a runtime un doppio che ha
# sbagliato una firma si scopre solo quando la prova che lo usa fallisce per un motivo
# che sembra un altro. Il controllo statico è l'unico posto in cui quella conformità è
# verificabile prima, ed è la ragione per cui `strict` non è negoziabile in questo
# progetto: senza, `Protocol` diventa documentazione.
