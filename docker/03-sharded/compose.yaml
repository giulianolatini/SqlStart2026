        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # Secondo anello: forma il replica set dei config server e crea
  # l'amministratore del cluster. Gira una volta e muore.
  #
  # NON DIPENDE DA cfg2 E cfg3, e non è una dimenticanza. Un servizio selezionato
  # non può dichiarare `depends_on` verso un servizio NON selezionato: Compose
  # rifiuta l'intero progetto con «depends on undefined service», uscita 1. Vale
  # in entrambe le direzioni — anche per un servizio senza profilo verso uno con
  # profilo, che era la riserva dichiarata da ADR-0010 e che V-053 ha chiuso
  # misurandola. Dipendere da cfg2 romperebbe quindi il profilo `palco`, dove
  # cfg2 non esiste.
  #
  # L'attesa degli altri membri la fa lo script, che li interroga per nome: è più
  # lavoro, ma è l'unico modo di ordinare l'avvio senza legare questo servizio a
  # un profilo.
  # ---------------------------------------------------------------------------

  cfg-init:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-cfg-init
    pull_policy: never
    restart: "no"
    profiles: ["palco", "completo"]

    mem_limit: 128m
    cpus: 0.25

    # LA riga del servizio. Questo container non ha un'interfaccia di rete
    # propria: usa quella di cfg1. Quindi `localhost` qui dentro è il `localhost`
    # del mongod, e la connessione gode dell'eccezione localhost — che permette
    # `replSetInitiate` e il primo `createUser` su un nodo che pretende
    # autenticazione ma non ha ancora nessun utente (ADR-0026, ADR-0040).
    #
    # Due conseguenze da conoscere prima di provare a violarle: cfg-init NON è
    # raggiungibile per nome sulla rete Compose, e NON può pubblicare porte. Non
    # gli serve nessuna delle due, ma il vincolo non è ovvio.
    network_mode: "service:cfg1"

    environment:
      NOME_REPLICA_CFG: ${NOME_REPLICA_CFG:-cfgrs}
      # I membri da configurare: dipendono dal profilo. Il predefinito è quello
      # del `palco`, che è il caso del talk.
      MEMBRI_CFG: ${MEMBRI_CFG:-cfg1:27017}
      # Tutti i membri possibili di questo componente. NON è parametrico: è la
      # verità sul file Compose, e serve allo script per accorgersi che gira un
      # container che non è fra i membri da configurare.
      CANDIDATI_CFG: "cfg1:27017,cfg2:27017,cfg3:27017"
      UTENTE_AMMINISTRATORE: ${UTENTE_AMMINISTRATORE:-admin}
      # La forma `:?` fa fallire l'avvio con un messaggio invece di creare un
      # amministratore con password vuota. Per Compose una variabile vuota vale
      # quanto una assente, quindi il segnaposto vuoto di .env.example scatta qui.
      PASSWORD_AMMINISTRATORE: ${PASSWORD_AMMINISTRATORE:?assente — copiare docker/03-sharded/.env.example in .env e riempire la password}

    command:
      - mongosh
      - --quiet
      - --host
      - localhost
      - --file
      - /init/10-cfg-initiate.js

    volumes:
      - ./init/10-cfg-initiate.js:/init/10-cfg-initiate.js:ro

    depends_on:
      cfg1:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # Terzo anello, in due copie. Forma i replica set dei due shard, in parallelo
  # fra loro e in parallelo con cfg-init: uno shard non ha bisogno del config
  # server per formarsi, ha bisogno del config server solo per essere REGISTRATO
  # nel cluster, e quello è il Task 3.
  #
  # UN `createUser` QUI C'È, e fino al Task 10 non c'era. Gli utenti del cluster
  # vivono sul config server e valgono attraverso mongos (§4 dello spike): uno
  # shard non ne riceve copia e restava senza utenti, cioè con l'eccezione
  # localhost aperta per tutta la vita del container (V-064). L'amministratore
  # locale creato da 11-shard-initiate.js la chiude. È la ragione per cui le due
  # credenziali arrivano fin qui, e sono le STESSE del config server: una sola
  # password per il cluster e per i suoi shard è una semplificazione di
  # laboratorio, spiegata e circoscritta in
  # docs/03-amministrazione/sicurezza-keyfile-x509.md §4.2.
  #
  # Vale tutto quello che dice cfg-init su `network_mode`, sull'eccezione
  # localhost e sul perché la dipendenza è verso il solo membro «a»: lì c'è il
  # ragionamento, qui solo il codice.
  # ---------------------------------------------------------------------------

  shard1-init:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-shard1-init
    pull_policy: never
    restart: "no"
    profiles: ["palco", "completo"]

    mem_limit: 128m
    cpus: 0.25

    network_mode: "service:shard1a"

    environment:
      NOME_REPLICA_SHARD: ${NOME_REPLICA_SHARD1:-shard1rs}
      MEMBRI_SHARD: ${MEMBRI_SHARD1:-shard1a:27017}
      CANDIDATI_SHARD: "shard1a:27017,shard1b:27017,shard1c:27017"
      UTENTE_AMMINISTRATORE: ${UTENTE_AMMINISTRATORE:-admin}
      PASSWORD_AMMINISTRATORE: ${PASSWORD_AMMINISTRATORE:?assente — copiare docker/03-sharded/.env.example in .env e riempire la password}

    command:
      - mongosh
      - --quiet
      - --host
      - localhost
      - --file
      - /init/11-shard-initiate.js

    volumes:
      - ./init/11-shard-initiate.js:/init/11-shard-initiate.js:ro

    depends_on:
      shard1a:
        condition: service_healthy

  # Identico a shard1-init salvo lo shard che inizializza: vedi lì.

  shard2-init:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-shard2-init
    pull_policy: never
    restart: "no"
    profiles: ["palco", "completo"]

    mem_limit: 128m
    cpus: 0.25

    network_mode: "service:shard2a"

    environment:
      NOME_REPLICA_SHARD: ${NOME_REPLICA_SHARD2:-shard2rs}
      MEMBRI_SHARD: ${MEMBRI_SHARD2:-shard2a:27017}
      CANDIDATI_SHARD: "shard2a:27017,shard2b:27017,shard2c:27017"
      UTENTE_AMMINISTRATORE: ${UTENTE_AMMINISTRATORE:-admin}
      PASSWORD_AMMINISTRATORE: ${PASSWORD_AMMINISTRATORE:?assente — copiare docker/03-sharded/.env.example in .env e riempire la password}

    command:
      - mongosh
      - --quiet
      - --host
      - localhost
      - --file
      - /init/11-shard-initiate.js

    volumes:
      - ./init/11-shard-initiate.js:/init/11-shard-initiate.js:ro

    depends_on:
      shard2a:
        condition: service_healthy

  # ---------------------------------------------------------------------------
  # QUARTO ANELLO — `mongos`, e qui il file cambia argomento.
  #
  # Fin qui c'erano nove `mongod`: processi che tengono dati su disco, entrano in
  # un replica set, eleggono un primario. `mongos` non è niente di tutto questo.
  # È un ROUTER: riceve la query, chiede al config server dove stanno i documenti
  # che servono, interroga solo gli shard che li hanno e ricompone la risposta.
  #
  # Tre assenze da leggere, perché sono il contenuto della slide:
  #
  #   niente --replSet     non è membro di niente e non elegge nessuno;
  #   niente volume dati   non ha uno stato da conservare: spento e riacceso
  #                        riparte identico leggendo il config server;
  #   niente --wiredTigerCacheSizeGB
  #                        non ha un motore di memorizzazione a cui dare una
  #                        cache. Passarglielo lo fa fallire all'avvio.
  #
  # Sono tre righe che negli altri servizi ci sono e qui no. Il commento serve
  # perché un'assenza non si vede leggendo: si vede solo confrontando.
  #
  # `--keyFile` invece SÌ, ed è lo stesso segreto degli altri nove. In un cluster
  # sharded l'autenticazione interna è di cluster: `mongos` deve presentarsi ai
  # config server e agli shard con la stessa chiave, o non gli parla nessuno.
  #
  # LA STRINGA `--configdb` ELENCA TUTTI E TRE I CONFIG SERVER, anche nel profilo
  # `palco` dove cfg2 e cfg3 non esistono, e non è una svista. `mongos` li tratta
  # da SEMI: ne contatta uno, si fa dire da lui la composizione reale del replica
  # set, e degli irraggiungibili non gli importa. Misurato nello spike del 25
  # agosto e riconfermato qui. Parametrizzarla per profilo aggiungerebbe un ramo
  # per risolvere un problema che non c'è.
  #
  # Il nome del set davanti alla barra NON è decorativo: è il nome del replica
  # set dei config server, e `mongos` rifiuta di partire se il set che trova si
  # chiama diversamente. È il motivo per cui NOME_REPLICA_CFG compare qui dentro.
  # ---------------------------------------------------------------------------

  mongos:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-mongos
    hostname: mongos
    pull_policy: never
    restart: unless-stopped
    profiles: ["palco", "completo"]

    # 256 MiB: non tiene dati, tiene la mappa dei chunk e le connessioni aperte
    # verso gli shard. È la voce più economica del bilancio del design §5.1, ed è
    # il motivo per cui due router stanno in piedi anche su un portatile.
    mem_limit: ${MEMORIA_MONGOS:-256m}
    cpus: ${CPU_MONGOS:-0.5}

    command:
      - mongos
      - --configdb
      - ${NOME_REPLICA_CFG:-cfgrs}/cfg1:27017,cfg2:27017,cfg3:27017
      - --keyFile
      - /keyfile/mongo-keyfile
      - --bind_ip_all
      - --port
      - "27017"

    ports:
      - "${PORTA_MONGOS:-27117}:27017"

    # Solo il keyfile. Nessun `dati-mongos`, e l'assenza è la lezione.
    volumes:
      - keyfile:/keyfile:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    # QUESTA SONDA DICE «ACCETTA CONNESSIONI», NON «IL CLUSTER SERVE», ed è una
    # scelta, non una scorciatoia. La differenza si vede provando a chiedere di
    # più: un `mongos` senza nessuno shard registrato risponde a `hello()`,
    # accetta connessioni e lascia leggere — e alla prima scrittura risponde che
    # non c'è nessuno shard. Una sonda che pretendesse due shard registrati
    # sarebbe più onesta e creerebbe uno stallo: `add-shard` gira dentro `mongos`
    # e non potrebbe aspettarlo sano, perché è lui a doverlo rendere sano.
    #
    # Il verdetto «il cluster serve» lo dà quindi un'altra cosa: il codice di
    # uscita di `add-shard`, che è un servizio one-shot e per definizione finisce
    # solo quando ha finito. È la stessa forma di ADR-0041 sullo stack 02 —
    # `up --wait` non è la prova, la prova è il one-shot che si ferma.
    #
    # Con una differenza rispetto allo stack 02, aggiunta dal Task 4: qui quel
    # verdetto arriva comunque dentro `up --wait`, perché il servizio `up-03` in
    # fondo al file aspetta che `add-shard` sia uscito bene (ADR-0062). Non è
    # questa sonda a essere diventata più severa: è che a valle c'è qualcuno che
    # la severità la esercita al posto suo.
    #
    # `hello()` passa senza credenziali anche su un `mongos` con `--keyFile` e
    # utenti già creati: è misurato, non dato per scontato. Vale la stessa
    # ragione dello stack 02 per cui la password non si mette nella riga di un
    # healthcheck: finirebbe in chiaro dentro `docker inspect`, per sempre, su
    # una riga che nessuno rilegge.
    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.hello().ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

    # Il replica set dei config server deve ESISTERE, non solo essere in piedi:
    # `mongos` interroga i metadati appena parte. Quindi si aspetta la fine di
    # cfg-init, non la salute di cfg1.
    depends_on:
      cfg-init:
        condition: service_completed_successfully

  # Il secondo router, solo nel profilo `completo`. Non serve a reggere il carico
  # del lab — non c'è carico — serve a mostrare mezza slide del Blocco 3: i
  # router sono più d'uno, sono senza stato, e sono intercambiabili. Fermarne uno
  # e continuare a lavorare sull'altro è una scena che dura dieci secondi e
  # spiega cos'è un componente stateless meglio di un elenco puntato.
  #
  # È identico a mongos salvo nome, porta e profilo: nessuna riga di
  # configurazione li distingue, ed è esattamente il punto.

  mongos2:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-mongos2
    hostname: mongos2
    pull_policy: never
    restart: unless-stopped
    profiles: ["completo"]

    mem_limit: ${MEMORIA_MONGOS:-256m}
    cpus: ${CPU_MONGOS:-0.5}

    command:
      - mongos
      - --configdb
      - ${NOME_REPLICA_CFG:-cfgrs}/cfg1:27017,cfg2:27017,cfg3:27017
      - --keyFile
      - /keyfile/mongo-keyfile
      - --bind_ip_all
      - --port
      - "27017"

    ports:
      - "${PORTA_MONGOS_2:-27118}:27017"

    volumes:
      - keyfile:/keyfile:ro

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

    healthcheck:
      test:
        - CMD
        - mongosh
        - --quiet
        - --eval
        - "quit(db.hello().ok === 1 ? 0 : 1)"
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 20s

    depends_on:
      cfg-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # QUINTO ANELLO — la registrazione degli shard nel cluster.
  #
  # È il comando che trasforma tre replica set che non si conoscono in uno
  # sharded cluster. Prima di `sh.addShard()` esistono cfgrs, shard1rs e
  # shard2rs, tutti funzionanti, nessuno dei quali sa degli altri; dopo, il
  # config server sa che shard1rs e shard2rs sono posti dove mettere documenti, e
  # `mongos` sa a chi chiedere.
  #
  # Gira dentro `mongos` e NON dentro un config server: `sh.addShard()` è un
  # comando che si dà al router. Ed è autenticato, a differenza dei tre init del
  # Task 2: quelli lavoravano sotto eccezione localhost su nodi senza utenti,
  # qui l'amministratore esiste già — l'ha creato cfg-init — e l'eccezione è
  # chiusa da un pezzo.
  # ---------------------------------------------------------------------------

  add-shard:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-add-shard
    pull_policy: never
    restart: "no"
    profiles: ["palco", "completo"]

    mem_limit: 128m
    cpus: 0.25

    network_mode: "service:mongos"

    environment:
      # Le stringhe di connessione dei due shard, nella forma che `sh.addShard()`
      # vuole: `nome-set/host:porta,host:porta`. Dipendono dal profilo per la
      # stessa ragione degli elenchi del Task 2, e valgono le stesse guardie.
      SHARD_1: ${NOME_REPLICA_SHARD1:-shard1rs}/${MEMBRI_SHARD1:-shard1a:27017}
      SHARD_2: ${NOME_REPLICA_SHARD2:-shard2rs}/${MEMBRI_SHARD2:-shard2a:27017}
      UTENTE_AMMINISTRATORE: ${UTENTE_AMMINISTRATORE:-admin}
      PASSWORD_AMMINISTRATORE: ${PASSWORD_AMMINISTRATORE:?assente — copiare docker/03-sharded/.env.example in .env e riempire la password}

    command:
      - mongosh
      - --quiet
      - --host
      - localhost
      - -u
      - ${UTENTE_AMMINISTRATORE:-admin}
      - -p
      - ${PASSWORD_AMMINISTRATORE:?assente — copiare docker/03-sharded/.env.example in .env e riempire la password}
      - --authenticationDatabase
      - admin
      - --file
      - /init/20-add-shard.js

    volumes:
      - ./init/20-add-shard.js:/init/20-add-shard.js:ro

    # `mongos` sano significa «accetta connessioni», che è quanto serve qui: è la
    # sonda di liveness discussa sopra, e la ragione per cui non è più severa.
    #
    # I due shard NON compaiono qui, e questa volta non è per i profili: è che
    # `sh.addShard()` vuole un replica set con un primario ELETTO, non un
    # container in piedi. Il fatto giusto da aspettare è quindi la fine dei due
    # init del Task 2, che si fermano solo dopo aver visto il primario.
    depends_on:
      mongos:
        condition: service_healthy
      shard1-init:
        condition: service_completed_successfully
      shard2-init:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # SESTO ANELLO — i dati di demo, e la shard key che decide dove finiscono.
  #
  # È l'unico anello della catena che non riguarda la topologia. Dopo
  # `add-shard` il cluster è fatto e non contiene niente: questo servizio
  # distribuisce `lab.ordini` con shard key `{_id: "hashed"}` e ci mette dentro
  # 20 000 documenti. Il perché di quella chiave — e perché una chiave monotona
  # manderebbe ogni inserimento su un solo shard — sta scritto per esteso in
  # `init/30-dati-demo.js`, che è il posto dove sta accanto al comando che la
  # applica.
  #
  # PERCHÉ È UN ANELLO E NON SOLO UN BERSAGLIO DEL MAKEFILE. Perché negli stack
  # 01 e 02 i dati ci sono appena l'avvio è finito, e una demo in cui il terzo
  # stack pretende un comando in più è un comando in più da ricordare a memoria
  # davanti al pubblico. `make seed-03` resta e serve a ricaricare, non a
  # caricare la prima volta.
  #
  # PERCHÉ DOPO add-shard E NON PRIMA. Distribuire una collezione vuota crea i
  # chunk in anticipo e li spalma **sugli shard registrati in quel momento**:
  # due chunk per shard. Fatto prima di `add-shard` il cluster ne avrebbe zero,
  # e `shardCollection` fallirebbe; fatto con un solo shard registrato darebbe
  # due chunk su uno solo e un balancer da rincorrere.
  #
  # IDEMPOTENTE, come tutti gli altri anelli: al secondo `up` trova i 20 000
  # documenti già lì e non fa niente, così `make up-03` su uno stack già
  # seminato resta veloce.
  #
  # La memoria è più larga di quella di `add-shard` perché qui `mongosh` tiene
  # in mano lotti da 5 000 documenti alla volta, mentre là spediva due stringhe.
  # ---------------------------------------------------------------------------

  seed:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-seed
    pull_policy: never
    restart: "no"
    profiles: ["palco", "completo"]

    mem_limit: 256m
    cpus: 0.5

    network_mode: "service:mongos"

    command:
      - mongosh
      - --quiet
      - --host
      - localhost
      - -u
      - ${UTENTE_AMMINISTRATORE:-admin}
      - -p
      - ${PASSWORD_AMMINISTRATORE:?assente — copiare docker/03-sharded/.env.example in .env e riempire la password}
      - --authenticationDatabase
      - admin
      - --file
      - /init/30-dati-demo.js

    volumes:
      - ./init/30-dati-demo.js:/init/30-dati-demo.js:ro

    # `RICARICA` non è dichiarata qui, ed è deliberato: `make seed-03` rilancia
    # QUESTO servizio con `run --rm -e RICARICA=1`, che è la forma già usata da
    # `seed-02`. Dichiararla nel file con un valore predefinito aggiungerebbe una
    # riga che non cambia niente e un posto in più dove cercarla.

    # Basta questa: `add-shard` a sua volta aspetta `mongos` sano e i due
    # shard-init finiti, che aspettano keyfile-init.
    depends_on:
      add-shard:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # up-03 — la sentinella, cioè il servizio che esiste perché `up --wait` mente.
  #
  # Non fa niente. Stampa una riga e dorme. È l'unico servizio dello stack che
  # non è MongoDB, e chi lo vede in `docker ps` ha diritto di chiedersi perché
  # c'è: la risposta è che senza di lui `docker compose up -d --wait` esce 0
  # mentre il cluster non c'è ancora.
  #
  # LA MISURA (V-056). `--wait` è documentato come «Wait services be
  # running|healthy» (S-057). Un one-shot che deve morire non ha healthcheck,
  # quindi la soglia che gli si applica è `running`, ed è soddisfatta
  # nell'istante in cui parte. L'ho misurato con un sosia di `add-shard`: senza
  # sentinella `up --wait` esce 0 dopo UN secondo mentre il one-shot ne ha
  # ancora sei da fare.
  #
  # Con la sentinella cambia, e cambia in tutti e due i versi:
  #
  #   one-shot che esce 0  ->  `up --wait` esce 0 dopo sette secondi, cioè
  #                            quando il lavoro è davvero finito
  #   one-shot che esce 7  ->  `up --wait` esce 1 e dice «service "add-shard"
  #                            didn't complete successfully: exit 7», lasciando
  #                            la sentinella nello stato `Created`
  #
  # PERCHÉ NON UN HEALTHCHECK SU add-shard. La tentazione è dargliene uno
  # perché `--wait` lo aspetti, e ADR-0041 l'aveva già scartata per lo stack
  # 02 con una ragione che vale anche qui: un healthcheck descrive un container
  # che resta vivo e continua a rispondere, mentre un one-shot deve morire. La
  # sentinella non piega quel concetto — `add-shard` resta senza healthcheck e
  # il suo verdetto resta un codice di uscita. Sposta la domanda su un servizio
  # che vive davvero, e usa `service_completed_successfully` per quello per cui
  # è documentato: un vincolo di ORDINE, non di salute (ADR-0062).
  #
  # QUELLO CHE LA SENTINELLA NON DÀ. `up --wait` esce **1**, non 7: il verdetto
  # è giusto, la diagnosi si perde. I codici di 20-add-shard.js — 6 per
  # addShard fallita, 7 per cluster incompleto — restano leggibili solo con
  # `docker compose wait add-shard`, che resta quindi lo strumento giusto per
  # chi automatizza e vuole distinguere le cause. Per chi sta al podio, un
  # comando che esce 1 e nomina il colpevole basta.
  #
  # PERCHÉ L'IMMAGINE DI MONGO E NON busybox. Sarebbe più leggera di due
  # ordini di grandezza, e costerebbe una seconda immagine da pinnare per digest
  # e da scaricare prima di partire. Il lab deve funzionare senza rete, e tutto
  # questo stack gira su UNA immagine sola: la sentinella non è un buon motivo
  # per romperlo. Il processo che resta acceso è `sleep`, non un mongod.
  # ---------------------------------------------------------------------------

  up-03:
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-up-03
    pull_policy: never
    # Non `unless-stopped`: se qualcuno lo ferma a mano ha voluto fermarlo, e
    # rialzarlo non aggiungerebbe niente — il lavoro che sorvegliava è già
    # fatto.
    restart: "no"
    profiles: ["palco", "completo"]

    # ADR-0004 chiede limiti espliciti a ogni servizio. Questi 64 MiB sono per un
    # `sleep`, e non entrano nel bilancio del design §5.1 perché qui dentro non
    # c'è nessun database.
    mem_limit: 64m
    cpus: 0.1

    # NIENTE healthcheck, ed è la scelta che fa funzionare tutto: senza, la
    # soglia di `--wait` per questo servizio è `running`, e diventa `running`
    # solo dopo che add-shard è uscito 0. Un healthcheck qui non aggiungerebbe
    # niente e ritarderebbe l'uscita di `up` del suo primo intervallo.
    #
    # Nota per chi confronta con ADR-0061: lì si diceva che una sonda di
    # PRONTEZZA su `mongos` sarebbe un cappio, perché add-shard aspetta la
    # salute di mongos. Qui il cappio non c'è, perché nessuno aspetta la
    # sentinella. È la stessa regola letta al contrario: la sonda severa si può
    # mettere solo su un servizio da cui non dipende nessuno.
    command:
      - bash
      - -c
      - |
        echo "cluster pronto — due shard registrati, lab.ordini distribuita e piena."
        echo "punto d'ingresso: mongodb://localhost:${PORTA_MONGOS:-27117}"
        exec sleep infinity

    depends_on:
      # L'unica dipendenza che serve, e copre tutta la catena in transitiva: seed
      # aspetta add-shard, add-shard aspetta mongos sano e i due shard-init
      # finiti, mongos aspetta cfg-init, e tutti e tre gli init aspettano
      # keyfile-init.
      #
      # Spostare la sentinella da add-shard a seed cambia che cosa promette
      # `up --wait`: prima «i due shard sono registrati», adesso «c'è anche il
      # dataset». È la promessa giusta, perché è quella che gli altri due stack
      # fanno già.
      seed:
        condition: service_completed_successfully

  # ---------------------------------------------------------------------------
  # L'APPLICAZIONE, DENTRO LA RETE. Qui la scoperta c'è, ma è di un altro tipo.
  #
  # Il client si collega a `mongos` — un seme solo, e non perché ce ne sia uno
  # solo: `mongos2` esiste nel profilo `completo`, e dichiararlo sempre vorrebbe
  # dire dichiarare un nome che di norma non risolve. Da lì pymongo vede una
  # topologia `Sharded`, e ciò che scopre non sono i membri di un set: sono i
  # router. Gli shard restano dietro, e il client non ci parla mai.
  #
  # `directConnection` resta spento come dall'host, ed è l'unico dei tre stack in
  # cui il valore non cambia con il punto di vista — perché il mongos è già il
  # punto d'ingresso, e collegarsi «direttamente» a lui è ciò che si fa comunque.
  # ---------------------------------------------------------------------------

  app:
    # L'immagine la costruisce `make app-image`, non un registro: qui niente
    # digest, perché quello che containerd le calcola lo stesso (M-037) non è
    # verificabile da fuori. La promessa di ADR-0009 si sposta sulle righe `FROM`
    # del Dockerfile, che `check_stack.py` legge e pretende pinnate (ADR-0093).
    image: mongolab:0.1.0

    build:
      context: ../../app
      args:
        PYTHON_IMAGE: ${PYTHON_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
        UV_IMAGE: ${UV_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}

    pull_policy: never

    # Un profilo tutto suo, e non `palco` o `completo`: quelli scelgono QUANTO
    # cluster accendere, questo dice se accendere uno strumento. `docker compose
    # run` attiva da sé il profilo del servizio che nomina, quindi la riga del
    # Makefile non deve saperne niente.
    profiles: ["strumenti"]

    # Niente container_name: `run` crea un container nuovo a ogni invocazione, e
    # due comandi lanciati insieme collidono su un nome fisso.

    mem_limit: ${MEMORIA_APP:-512m}
    cpus: ${CPU_APP:-1.0}

    restart: "no"

    environment:
      MONGOLAB_PUNTO_DI_VISTA: rete
      # Per ambiente e non dal .env, che nel container non c'è: il file sta
      # sull'host, git lo ignora (ADR-0014), e il valore non passa mai per la
      # riga di comando del client docker (ADR-0054).
      UTENTE_AMMINISTRATORE: ${UTENTE_AMMINISTRATORE:-admin}
      PASSWORD_AMMINISTRATORE: ${PASSWORD_AMMINISTRATORE:?assente — copiare .env.example in .env e riempirlo}

    volumes:
      - ../../app/src:/app/src:ro

    # Niente `depends_on`: su questo stack sarebbe la catena intera, e `make
    # app-stats` accenderebbe diciotto container invece di dire che sono spenti.

    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  keyfile:
  dati-cfg1:
  dati-cfg2:
  dati-cfg3:
  dati-shard1a:
  dati-shard1b:
  dati-shard1c:
  dati-shard2a:
  dati-shard2b:
  dati-shard2c:
