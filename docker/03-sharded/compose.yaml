  shard2c:
    # Identico a shard1a salvo nome, set, porta, volume e profilo: vedi lì.
    image: ${MONGO_IMAGE:?assente — eseguire «make images-pull», oppure passare --env-file tools/images.env}
    container_name: sh-shard2c
    hostname: shard2c
